default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "1247" } %>

development:
  <<: *default
  database: mercado_local_development

test:
  <<: *default
  database: mercado_local_test

production:
  <<: *default
  database: mercado_local_production
  username: <%= ENV["MERCADO_LOCAL_DATABASE_USERNAME"] %>
  password: <%= ENV["MERCADO_LOCAL_DATABASE_PASSWORD"] %>